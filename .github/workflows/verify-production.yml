# Runs the rollout verification from GitHub's runners, because the agent sandbox
# it was written in has no egress to the deployment.
#
# Manual: Actions → "Verify production" → Run workflow.
# It writes two plainly-named, non-public rows (see scripts/verify-production.mjs)
# and prints cleanup SQL. The matrix is committed back as `verify-report.txt` so
# it can be read from anywhere. Manual-only means that commit cannot start
# another run — which is the other reason this trigger is not a push filter.
name: Verify production

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment to check
        required: false
        default: https://cafe-caption-ai.vercel.app
  # Manual only, on purpose: every run writes two real rows to the production
  # database and leaves the cleanup SQL for a human. Triggering that on every
  # merge would fill the tables with junk nobody reads.
  #
  # (This used to be pinned to a long-merged agent branch, which meant it had
  # silently stopped running at all.)

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Verify deployed write paths
        env:
          BASE_URL: ${{ inputs.base_url || 'https://cafe-caption-ai.vercel.app' }}
          # Optional: add these as repository *variables* (they are public) to get
          # the "anon INSERT refused" rows. Without them those two rows are SKIP.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          node scripts/verify-production.mjs "$BASE_URL" | tee verify-report.txt

      - name: Commit the report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify-report.txt
          git diff --cached --quiet || git commit -m "chore: production verification report [skip ci]"
          git push
